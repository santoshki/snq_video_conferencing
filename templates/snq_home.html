<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SnQ Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='snq_home_screen_style.css') }}">
</head>
<body>

    <!-- 🌊 BACKGROUND WAVES -->
    <div class="wave-bg">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- 🔹 SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-title">SnQ Home</div>

        <nav class="sidebar-menu">
            <a href="#" class="active">🏠 Home</a>
            <a href="#">📅 Past Meetings</a>
            <a href="#">⚙️ Settings</a>
            <a href="#">ℹ️ About</a>
            <br><br>
            <a href="{{ url_for('logout') }}" class="logout-button">Logout</a>
        </nav>
    </aside>

    <!-- TOP BAR -->
    <header class="top-bar">
        <div class="top-bar-title">Welcome, {{ username }}!</div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="page-content">
        <div class="login-container">

            <!-- 🎥 Animated Title -->
            <h2 class="title-with-icon">
                <span class="video-icon">🎥</span>
                SnQ Video Conferencing
            </h2>

            <p>Let's get Started</p>

            <form method="post">
                <button type="submit" name="action" value="new_meeting">
                    New SnQ Meeting
                </button>
                <button type="submit" name="action" value="join_meeting">
                    Join SnQ Meeting
                </button>
            </form>
        </div>
    </main>

</body>
</html>
