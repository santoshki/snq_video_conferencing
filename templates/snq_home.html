<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SnQ Home</title>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='snq_home_screen_style.css') }}">
</head>

<body>

<!-- 🌊 BACKGROUND -->
<div class="wave-bg">
    <span></span>
    <span></span>
    <span></span>
</div>

<!-- 🔹 SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-title">SnQ Home</div>

    <nav class="sidebar-menu">
        <a href="#" class="active">🏠 Home</a>
        <a href="#">📅 Past Meetings</a>
        <a href="#">⚙️ Settings</a>
        <a href="#">ℹ️ About</a>

        <div class="logout-wrapper">
            <a href="{{ url_for('logout') }}" class="logout-button">
                <i class="fas fa-right-from-bracket"></i>
                Logout
            </a>
        </div>
    </nav>
</aside>

<!-- 🔝 TOP BAR -->
<header class="top-bar">
    <div class="top-bar-title">Welcome, {{ username }}!</div>
</header>

<!-- 📄 MAIN -->
<main class="page-content">
    <div class="login-container">

        <!-- 🎥 HEADER -->
        <h2 class="title-with-icon">
            <span class="video-icon">🎥</span>
            SnQ Video Conferencing
        </h2>

        <p class="tagline">Connect instantly. Collaborate seamlessly.</p>

        <!-- 🔥 PRIMARY ACTION -->
        <button type="button" onclick="openModal()" class="primary-btn">
            <i class="fas fa-video"></i>
            New SnQ Meeting
        </button>

        <!-- SECONDARY ACTIONS -->
        <div class="secondary-actions">
            <form method="post">
                <button
                    type="button"
                    class="secondary-btn"
                    onclick="openJoinModal()">
                    <i class="fas fa-key"></i>
                    Join SnQ Meeting
                </button>
            </form>

            <form method="post">
                <button type="submit" name="action" value="schedule_meeting" class="secondary-btn">
                    <i class="fas fa-calendar-plus"></i>
                    Schedule Meeting
                </button>
            </form>
        </div>

    </div>
</main>

<!-- 🟣 NEW MEETING MODAL -->
<div id="meetingModal" class="modal">
    <div class="modal-content">

        <div class="modal-header">
            <h3>🎥 Start New Meeting</h3>
            <span class="close-btn" onclick="closeModal()">✖</span>
        </div>

        <form method="post" class="modal-form">
            <input type="hidden" name="action" value="create_meeting">

            <!-- Meeting Title -->
            <div class="form-group">
                <label>Meeting Title</label>
                <input type="text" name="meeting_title" placeholder="e.g. Team Sync" required>
            </div>

            <!-- Meeting ID -->
            <div class="form-group">
                <label>Meeting ID</label>
                <div class="input-with-btn">
                    <input type="text" name="meeting_id" id="generatedId" readonly>
                    <button type="button" class="copy-btn" onclick="copyMeetingId()">Copy</button>
                </div>
            </div>

            <!-- Actions -->
            <div class="modal-actions">
                <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button type="submit" class="primary-btn">Start Meeting</button>
            </div>
        </form>

    </div>
</div>


<!-- 🟢 JOIN MEETING MODAL -->
<div id="joinMeetingModal" class="modal">
    <div class="modal-content">

        <div class="modal-header">
            <h3>🔑 Join SnQ Meeting</h3>
            <span class="close-btn" onclick="closeJoinModal()">✖</span>
        </div>

        <form method="post" class="modal-form">
            <input type="hidden" name="action" value="join_meeting">

            <div class="form-group">
                <label>Meeting Name (Optional)</label>
                <input
                    type="text"
                    name="meeting_name"
                    placeholder="e.g. John Doe">
            </div>

            <div class="form-group">
                <label>Meeting ID</label>
                <input
                    type="text"
                    name="meeting_id"
                    placeholder="Enter Meeting ID"
                    required>
            </div>

            <div class="modal-actions">
                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeJoinModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-btn">
                    Join Meeting
                </button>
            </div>

        </form>

    </div>
</div>

<!-- ⚡ SCRIPT -->
<script>
function generateMeetingId() {
    return 'snq-' + Math.random().toString(36).substring(2, 10);
}

function openModal() {
    const modal = document.getElementById("meetingModal");
    modal.style.display = "flex";

    const idField = document.getElementById("generatedId");
    idField.value = generateMeetingId();
}

function closeModal() {
    document.getElementById("meetingModal").style.display = "none";
}

function copyMeetingId() {
    const input = document.getElementById("generatedId");
    input.select();
    document.execCommand("copy");
}

function openJoinModal() {
    document.getElementById("joinMeetingModal").style.display = "flex";
}

function closeJoinModal() {
    document.getElementById("joinMeetingModal").style.display = "none";
}
window.onclick = function(event) {

    if (event.target == document.getElementById("meetingModal")) {
        closeModal();
    }

    if (event.target == document.getElementById("joinMeetingModal")) {
        closeJoinModal();
    }
}
</script>

</body>
</html>
