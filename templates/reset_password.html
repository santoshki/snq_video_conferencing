<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - SnQ</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='reset_password_styles.css') }}"
    >
</head>

<body>

    <div class="reset-container">

        <h2>Reset Password</h2>

        <p class="subtitle">
            Enter your new password below.
        </p>

        <form
            method="POST"
            action="{{ url_for('reset_password') }}"
            id="resetForm"
        >

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    minlength="8"
                    required
                >

            </div>


            <!-- Supabase recovery tokens -->
            <input
                type="hidden"
                name="access_token"
                id="access_token"
            >

            <input
                type="hidden"
                name="refresh_token"
                id="refresh_token"
            >


            <button type="submit">
                Reset Password
            </button>

        </form>

    </div>


    <script>

        // Get the URL fragment after #
        const hash = window.location.hash.substring(1);

        // Convert it into URL parameters
        const params = new URLSearchParams(hash);

        // Get Supabase recovery tokens
        const accessToken = params.get("access_token");
        const refreshToken = params.get("refresh_token");


        // Store tokens in hidden form fields
        document.getElementById("access_token").value =
            accessToken || "";

        document.getElementById("refresh_token").value =
            refreshToken || "";


        // Remove sensitive tokens from the browser URL
        if (accessToken) {

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        }

    </script>

</body>
</html>
