<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SnQ Video Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='room_styles.css') }}">
</head>

<body>
<div id="toastContainer"></div>

<div class="container" id="meetingContainer">
    <!-- =========================
     Meeting Header
========================= -->
<div class="meeting-header">

    <div class="meeting-left">
        <div class="meeting-title">
            <h2 id="meetingTitle">
                {{ meeting_title if meeting_title else "SnQ Meeting" }}
            </h2>
            <span class="secure-badge">🔒 Secure</span>
        </div>

        <div class="meeting-room">
            <span class="label">Room:</span>
            <span id="roomId">{{ room_id }}</span>
        </div>
    </div>

    <div class="meeting-center">
        <div class="meeting-timer">
            <span class="timer-label">Duration</span>
            <div id="meetingTimer" class="timer">00:00</div>
        </div>
    </div>

    <div class="meeting-right">

        <div class="participant-info">
            👥
            <span id="participantCount">1</span>
        </div>

        <button id="copyRoomBtn" class="header-btn">
            📋 Copy Invite
        </button>

    </div>

</div>

    <!-- ===================================
     Video Area
==================================== -->
<div class="meeting-stage">
    <!-- Main Remote Video -->
    <div class="remote-video-container">
        <video id="remoteVideo"
               autoplay
               playsinline></video>
        <div id="remoteEmptyState" class="video-overlay">
            <div class="user-info">
                <span class="status-dot"></span>
            </div>
            <div class="network-badge">
                🟢 HD
            </div>
        </div>
    </div>

    <div class="local-preview">
        <video id="localVideo"
               autoplay
               muted
               playsinline></video>

        <div class="local-label">
            <span>You ({{ username }})</span>
        </div>
    </div>
</div>

    <!-- ===================================
     Meeting Control Dock
==================================== -->
<div class="meeting-controls">

    <button id="muteAudioBtn"
            class="control-btn"
            onclick="toggleAudio()"
            title="Mute Microphone">

        <span class="control-icon">🎤</span>
        <span class="control-text">Mic On</span>

    </button>

    <button id="disableVideoBtn"
            class="control-btn"
            onclick="toggleVideo()"
            title="Toggle Camera">

        <span class="control-icon">📷</span>
        <span class="control-text">Camera</span>

    </button>

    <button id="screenShareBtn"
            class="control-btn"
            onclick="toggleScreenShare()"
            title="Share Screen">

        <span class="control-icon">🖥️</span>
        <span class="control-text">Share</span>

    </button>

    <button id="chatToggleBtn"
            class="control-btn"
            title="Chat">

        <span class="control-icon">💬</span>
        <span class="control-text">Chat</span>

    </button>

    <button id="participantsBtn"
            class="control-btn"
            title="Participants">

        <span class="control-icon">👥</span>
        <span class="control-text">People</span>

    </button>

    <button id="settingsBtn"
            class="control-btn"
            title="Settings">

        <span class="control-icon">⚙️</span>
        <span class="control-text">Settings</span>

    </button>

    <button id="exitMeetingBtn"
            class="control-btn danger"
            onclick="exitMeeting()"
            title="Leave Meeting">

        <span class="control-icon">➡️</span>
        <span class="control-text">Leave</span>

    </button>

</div>

    </div> <!-- End .container -->

<!-- ======================================
     Chat Sidebar
====================================== -->

<div id="chatPanel" class="chat-panel">

    <div class="chat-header">

        <h3>Meeting Chat</h3>

        <button id="closeChatBtn">
            ✕
        </button>

    </div>

    <div id="messages"></div>

    <div class="chat-input-group">

        <input
            id="chatInput"
            placeholder="Type a message...">

        <button id="sendBtn">
            ➤
        </button>

    </div>

</div>


<script>
/* -----------------------------------
   VARIABLES FROM FLASK
----------------------------------- */
const ROOM_ID = "{{ room_id }}";
const USERNAME = "{{ username }}";
const TOKEN = "{{ token }}";

/* -----------------------------------
   GLOBALS
----------------------------------- */
let localStream = null;
let cameraTrack = null;       // original camera video track (kept aside during screen share)
let peerConnection = null;
let ws = null;

let meetingStartTime = null;
let meetingTimerInterval = null;

let isAudioEnabled = true;
let isVideoEnabled = true;
let isScreenSharing = false;

let remoteUser = null;        // name of the other participant, once known
let participantCount = 1;

const rtcConfig = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
    ]
};

/* -----------------------------------
   TOASTS / NOTIFICATIONS
----------------------------------- */
function showToast(text) {
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");
    toast.className = "snq-toast";
    toast.textContent = text;
    container.appendChild(toast);

    requestAnimationFrame(() => toast.classList.add("show"));

    setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
    }, 3500);
}

/* -----------------------------------
   PARTICIPANT COUNT
----------------------------------- */
function setParticipantCount(count) {
    participantCount = count;
    const el = document.getElementById("participantCount");
    if (el) el.textContent = String(count);
}

/* -----------------------------------
   MEETING TIMER
----------------------------------- */
function startMeetingTimer() {

    if (meetingTimerInterval) return;

    const timer = document.getElementById("meetingTimer");

    if (!timer) {
        console.error("meetingTimer element not found");
        return;
    }

    meetingStartTime = Date.now();

    timer.textContent = "00:00";

    meetingTimerInterval = setInterval(() => {

        const elapsed = Math.floor((Date.now() - meetingStartTime) / 1000);

        const hours = Math.floor(elapsed / 3600);
        const minutes = Math.floor((elapsed % 3600) / 60);
        const seconds = elapsed % 60;

        let display = "";

        if (hours > 0) {
            display += String(hours).padStart(2, "0") + ":";
        }

        display +=
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");

        timer.textContent = display;

    }, 1000);

    console.log("Meeting timer started");
}

/* -----------------------------------
   START MEDIA
----------------------------------- */
async function initMedia() {

    try {

        localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        });

        cameraTrack = localStream.getVideoTracks()[0] || null;

        document.getElementById("localVideo").srcObject = localStream;

    } catch (err) {

        console.error("Media Error:", err);
        showToast("Could not access camera/microphone");

    }

}

/* -----------------------------------
   WEBSOCKET
----------------------------------- */
function connectWebSocket() {

    try {

        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        // NOTE: adjust host/port here to match your signaling server deployment.
        const wsHost = window.location.hostname || "localhost";
        ws = new WebSocket(protocol + "://" + wsHost + ":8080/ws?token=" + encodeURIComponent(TOKEN));

        ws.onopen = () => {

            console.log("Connected");

            ws.send(JSON.stringify({
                type: "join",
                room: ROOM_ID,
                user: USERNAME
            }));

        };

        ws.onmessage = async (event) => {

            let msg;
            try {
                msg = JSON.parse(event.data);
            } catch (e) {
                console.error("Bad WS message:", event.data);
                return;
            }

            switch (msg.type) {

                /* Sent by server right after we join, describing who's
                   already in the room. Expected shape:
                   { type: "room-info", users: ["alice"], count: 2 } */
                case "room-info":
                    handleRoomInfo(msg);
                    break;

                /* Sent to everyone already in the room when someone new joins.
                   Expected shape: { type: "user-joined", user: "bob", count: 2 } */
                case "user-joined":
                    await handleUserJoined(msg);
                    break;

                /* Sent to remaining participants when someone leaves.
                   Expected shape: { type: "user-left", user: "bob", count: 1 } */
                case "user-left":
                    handleUserLeft(msg);
                    break;

                case "offer":
                    await handleOffer(msg.offer, msg.user);
                    break;

                case "answer":
                    if (peerConnection)
                        await peerConnection.setRemoteDescription(msg.answer);
                    break;

                case "ice":
                    if (peerConnection && msg.candidate) {
                        try {
                            await peerConnection.addIceCandidate(msg.candidate);
                        } catch (e) {
                            console.error("Error adding ICE candidate:", e);
                        }
                    }
                    break;

                case "chat":
                    addChatMessage(msg.user, msg.message);
                    break;

            }

        };

        ws.onclose = () => console.log("WebSocket closed");

        ws.onerror = (e) => console.error("WebSocket error:", e);

    }
    catch (e) {

        console.error(e);

    }

}

/* Existing participants I'm joining into */
function handleRoomInfo(msg) {
    const users = msg.users || [];
    setParticipantCount(typeof msg.count === "number" ? msg.count : users.length + 1);

    if (users.length > 0) {
        remoteUser = users[0];
        document.getElementById("remoteUserName").textContent = remoteUser;
        // I am the newcomer; the peer already in the room will initiate the offer
        // once it receives my "user-joined" event, so I just wait.
    }
}

/* Someone else joined after me — I already have media ready, so I initiate. */
async function handleUserJoined(msg) {
    setParticipantCount(typeof msg.count === "number" ? msg.count : participantCount + 1);

    if (msg.user) {
        remoteUser = msg.user;
        document.getElementById("remoteUserName").textContent = remoteUser;
        showToast(msg.user + " joined the meeting");
        addSystemChatMessage(msg.user + " joined the meeting");
    }

    await createOffer();
}

function handleUserLeft(msg) {
    setParticipantCount(typeof msg.count === "number" ? Math.max(1, msg.count) : Math.max(1, participantCount - 1));

    if (msg.user) {
        showToast(msg.user + " left the meeting");
        addSystemChatMessage(msg.user + " left the meeting");
    }

    // Tear down the peer connection so we're ready for the next participant
    if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
    }

    const remoteVideo = document.getElementById("remoteVideo");
    remoteVideo.srcObject = null;
    document.getElementById("remoteUserName").textContent = "Waiting for someone to join…";
    remoteUser = null;
}

/* -----------------------------------
   WEBRTC
----------------------------------- */
function createPeer() {

    if (peerConnection) return;

    peerConnection = new RTCPeerConnection(rtcConfig);

    if (localStream) {

        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

    }

    peerConnection.ontrack = (event) => {

        document.getElementById("remoteVideo").srcObject = event.streams[0];

    };

    peerConnection.onicecandidate = (event) => {

        if (event.candidate && ws) {

            ws.send(JSON.stringify({
                type: "ice",
                room: ROOM_ID,
                candidate: event.candidate
            }));

        }

    };

    peerConnection.onconnectionstatechange = () => {
        console.log("Connection state:", peerConnection.connectionState);
    };

}

async function createOffer() {

    createPeer();

    const offer = await peerConnection.createOffer();

    await peerConnection.setLocalDescription(offer);

    ws.send(JSON.stringify({
        type: "offer",
        room: ROOM_ID,
        user: USERNAME,
        offer
    }));

}

async function handleOffer(offer, fromUser) {

    createPeer();

    if (fromUser) {
        remoteUser = fromUser;
        document.getElementById("remoteUserName").textContent = fromUser;
    }

    await peerConnection.setRemoteDescription(offer);

    const answer = await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(answer);

    ws.send(JSON.stringify({
        type: "answer",
        room: ROOM_ID,
        user: USERNAME,
        answer
    }));

}

/* -----------------------------------
   CHAT
----------------------------------- */
function sendChatMessage() {

    const input = document.getElementById("chatInput");

    const message = input.value.trim();

    if (!message) return;

    if (ws && ws.readyState === WebSocket.OPEN) {

        ws.send(JSON.stringify({
            type: "chat",
            room: ROOM_ID,
            user: USERNAME,
            message
        }));

    }

    addChatMessage("Me", message);

    input.value = "";

}

document.getElementById("sendBtn").onclick = sendChatMessage;

document.getElementById("chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        sendChatMessage();
    }
});

function addChatMessage(user, message) {

    const messages = document.getElementById("messages");

    const isMe = user === "Me";

    const initials = user.charAt(0).toUpperCase();

    const now = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

    const msg = document.createElement("div");
    msg.className = isMe ? "chat-message me" : "chat-message";

    const avatar = document.createElement("div");
    avatar.className = "chat-avatar";
    avatar.textContent = initials;

    const bubble = document.createElement("div");
    bubble.className = "chat-bubble";

    const userEl = document.createElement("div");
    userEl.className = "chat-user";
    userEl.textContent = user;

    const textEl = document.createElement("div");
    textEl.className = "chat-text";
    textEl.textContent = message; // textContent avoids any HTML/script injection

    const timeEl = document.createElement("div");
    timeEl.className = "chat-time";
    timeEl.textContent = now;

    bubble.appendChild(userEl);
    bubble.appendChild(textEl);
    bubble.appendChild(timeEl);

    msg.appendChild(avatar);
    msg.appendChild(bubble);

    messages.appendChild(msg);

    messages.scrollTop = messages.scrollHeight;
}

function addSystemChatMessage(text) {
    const messages = document.getElementById("messages");

    const msg = document.createElement("div");
    msg.className = "chat-message system";
    msg.style.textAlign = "center";
    msg.style.opacity = "0.7";
    msg.style.fontSize = "12px";
    msg.textContent = text;

    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
}

/* -----------------------------------
   CONTROLS
----------------------------------- */
function toggleAudio() {

    if (!localStream) return;

    const track = localStream.getAudioTracks()[0];

    if (!track) return;

    track.enabled = !track.enabled;
    isAudioEnabled = track.enabled;

    const btn = document.getElementById("muteAudioBtn");
    const icon = btn.querySelector(".control-icon");
    const text = btn.querySelector(".control-text");

    if (isAudioEnabled) {
        btn.classList.remove("off");
        icon.textContent = "🎤";
        text.textContent = "Mic On";
    } else {
        btn.classList.add("off");
        icon.textContent = "🔇";
        text.textContent = "Muted";
    }

}

function toggleVideo() {

    if (!localStream) return;

    const track = localStream.getVideoTracks()[0];

    if (!track) return;

    track.enabled = !track.enabled;
    isVideoEnabled = track.enabled;

    const btn = document.getElementById("disableVideoBtn");
    const icon = btn.querySelector(".control-icon");
    const text = btn.querySelector(".control-text");

    if (isVideoEnabled) {
        btn.classList.remove("off");
        icon.textContent = "📷";
        text.textContent = "Camera";
    } else {
        btn.classList.add("off");
        icon.textContent = "📷";
        text.textContent = "Cam Off";
    }

}

async function toggleScreenShare() {

    const btn = document.getElementById("screenShareBtn");
    const icon = btn.querySelector(".control-icon");
    const text = btn.querySelector(".control-text");

    if (!isScreenSharing) {

        try {

            const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const screenTrack = displayStream.getVideoTracks()[0];

            if (peerConnection) {
                const sender = peerConnection
                    .getSenders()
                    .find(s => s.track && s.track.kind === "video");

                if (sender) sender.replaceTrack(screenTrack);
            }

            // Show my own screen share in the local preview too
            document.getElementById("localVideo").srcObject = displayStream;

            isScreenSharing = true;
            btn.classList.add("active-share");
            icon.textContent = "🟢";
            text.textContent = "Sharing";

            // When the user stops sharing via the browser's own UI control
            screenTrack.onended = () => stopScreenShare();

        } catch (err) {
            console.error("Screen share error:", err);
        }

    } else {

        stopScreenShare();

    }

}

function stopScreenShare() {

    const btn = document.getElementById("screenShareBtn");
    const icon = btn.querySelector(".control-icon");
    const text = btn.querySelector(".control-text");

    if (peerConnection && cameraTrack) {
        const sender = peerConnection
            .getSenders()
            .find(s => s.track && s.track.kind === "video");

        if (sender) sender.replaceTrack(cameraTrack);
    }

    if (localStream) {
        document.getElementById("localVideo").srcObject = localStream;
    }

    isScreenSharing = false;
    btn.classList.remove("active-share");
    icon.textContent = "🖥️";
    text.textContent = "Share";

}

function exitMeeting() {

    clearInterval(meetingTimerInterval);

    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
            type: "leave",
            room: ROOM_ID,
            user: USERNAME
        }));
    }

    if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
    }

    if (localStream) {

        localStream.getTracks().forEach(t => t.stop());

    }

    if (ws) {

        ws.close();

    }

    window.location.href = "/home";

}

/* -----------------------------------
   COPY INVITE
----------------------------------- */
document.getElementById("copyRoomBtn").addEventListener("click", async () => {

    const inviteLink = window.location.origin + "/room/" + encodeURIComponent(ROOM_ID);

    try {
        await navigator.clipboard.writeText(inviteLink);
    } catch (err) {
        const temp = document.createElement("textarea");
        temp.value = inviteLink;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
    }

    showToast("✅ Link copied successfully");

});

/* -----------------------------------
   CHAT PANEL
----------------------------------- */
const chatPanel = document.getElementById("chatPanel");
const meetingContainer = document.getElementById("meetingContainer");

document.getElementById("chatToggleBtn").onclick = () => {

    chatPanel.classList.add("open");
    meetingContainer.classList.add("chat-open");

};

document.getElementById("closeChatBtn").onclick = () => {

    chatPanel.classList.remove("open");
    meetingContainer.classList.remove("chat-open");

};

/* -----------------------------------
   INIT
----------------------------------- */
window.addEventListener("load", async () => {

    startMeetingTimer();

    await initMedia();

    connectWebSocket();

});

window.addEventListener("beforeunload", () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "leave", room: ROOM_ID, user: USERNAME }));
    }
});
</script>

</body>
</html>
