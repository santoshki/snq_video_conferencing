<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SnQ Video Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='index_styles.css') }}">
</head>

<body>
<div class="container" id="meetingContainer">
    <!-- =========================
     Meeting Header
========================= -->
<div class="meeting-header">

    <div class="meeting-left">
        <div class="meeting-title">
            <h2>SnQ Meeting</h2>
            <span class="secure-badge">🔒 Secure</span>
        </div>

        <div class="meeting-room">
            <span class="label">Room:</span>
            <span id="roomId">{{ room_id }}</span>
        </div>
    </div>

    <div class="meeting-center">
        <div class="meeting-timer">
            <span class="timer-label">Duration</span>
            <div id="meetingTimer" class="timer">00:00</div>
        </div>
    </div>

    <div class="meeting-right">

        <div class="participant-info">
            👥
            <span id="participantCount">1</span>
        </div>

        <button id="copyRoomBtn" class="header-btn">
            📋 Copy Invite
        </button>

    </div>

</div>

    <!-- ===================================
     Video Area
==================================== -->
<div class="meeting-stage">
    <!-- Main Remote Video -->
    <div class="remote-video-container">
        <video id="remoteVideo"
               autoplay
               playsinline></video>
        <div class="video-overlay">
            <div class="user-info">
                <span class="status-dot"></span>
                <span id="remoteUserName">Remote User</span>
            </div>
            <div class="network-badge">
                🟢 HD
            </div>
        </div>
    </div>

    <div class="local-preview">
        <video id="localVideo"
               autoplay
               muted
               playsinline></video>

        <div class="local-label">
            <span>You ({{ username }})</span>
        </div>
    </div>
</div>

    <!-- ===================================
     Meeting Control Dock
==================================== -->
<div class="meeting-controls">

    <button id="muteAudioBtn"
            class="control-btn"
            onclick="toggleAudio()"
            title="Mute Microphone">

        <span class="control-icon">🎤</span>
        <span class="control-text">Mic</span>

    </button>

    <button id="disableVideoBtn"
            class="control-btn"
            onclick="toggleVideo()"
            title="Toggle Camera">

        <span class="control-icon">📷</span>
        <span class="control-text">Camera</span>

    </button>

    <button id="screenShareBtn"
            class="control-btn"
            onclick="startScreenShare()"
            title="Share Screen">

        <span class="control-icon">🖥️</span>
        <span class="control-text">Share</span>

    </button>

    <button id="chatToggleBtn"
            class="control-btn"
            title="Chat">

        <span class="control-icon">💬</span>
        <span class="control-text">Chat</span>

    </button>

    <button id="participantsBtn"
            class="control-btn"
            title="Participants">

        <span class="control-icon">👥</span>
        <span class="control-text">People</span>

    </button>

    <button id="settingsBtn"
            class="control-btn"
            title="Settings">

        <span class="control-icon">⚙️</span>
        <span class="control-text">Settings</span>

    </button>

    <button id="exitMeetingBtn"
            class="control-btn danger"
            onclick="exitMeeting()"
            title="Leave Meeting">

        <span class="control-icon">📞</span>
        <span class="control-text">Leave</span>

    </button>

</div>

    </div> <!-- End .container -->

<!-- ======================================
     Chat Sidebar
====================================== -->

<div id="chatPanel" class="chat-panel">

    <div class="chat-header">

        <h3>Meeting Chat</h3>

        <button id="closeChatBtn">
            ✕
        </button>

    </div>

    <div id="messages"></div>

    <div class="chat-input-group">

        <input
            id="chatInput"
            placeholder="Type a message...">

        <button id="sendBtn">
            Send
        </button>

    </div>

</div>


<script>
/* -----------------------------------
   VARIABLES FROM FLASK
----------------------------------- */
const ROOM_ID = "{{ room_id }}";
const USERNAME = "{{ username }}";
const TOKEN = "{{ token }}";

/* -----------------------------------
   GLOBALS
----------------------------------- */
let localStream = null;
let peerConnection = null;
let ws = null;

let meetingStartTime = null;
let meetingTimerInterval = null;

const rtcConfig = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
    ]
};

/* -----------------------------------
   MEETING TIMER
----------------------------------- */
function startMeetingTimer() {

    if (meetingTimerInterval) return;

    const timer = document.getElementById("meetingTimer");

    if (!timer) {
        console.error("meetingTimer element not found");
        return;
    }

    meetingStartTime = Date.now();

    timer.textContent = "00:00";

    meetingTimerInterval = setInterval(() => {

        const elapsed = Math.floor((Date.now() - meetingStartTime) / 1000);

        const hours = Math.floor(elapsed / 3600);
        const minutes = Math.floor((elapsed % 3600) / 60);
        const seconds = elapsed % 60;

        let display = "";

        if (hours > 0) {
            display += String(hours).padStart(2, "0") + ":";
        }

        display +=
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");

        timer.textContent = display;

    }, 1000);

    console.log("Meeting timer started");
}

/* -----------------------------------
   START MEDIA
----------------------------------- */
async function initMedia() {

    try {

        localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        });

        document.getElementById("localVideo").srcObject = localStream;

    } catch (err) {

        console.error("Media Error:", err);

    }

}

/* -----------------------------------
   WEBSOCKET
----------------------------------- */
function connectWebSocket() {

    try {

        ws = new WebSocket("ws://localhost:8080/ws?token=" + TOKEN);

        ws.onopen = () => {

            console.log("Connected");

            ws.send(JSON.stringify({
                type: "join",
                room: ROOM_ID,
                user: USERNAME
            }));

        };

        ws.onmessage = async (event) => {

            const msg = JSON.parse(event.data);

            switch (msg.type) {

                case "offer":
                    await handleOffer(msg.offer);
                    break;

                case "answer":
                    if (peerConnection)
                        await peerConnection.setRemoteDescription(msg.answer);
                    break;

                case "ice":
                    if (peerConnection)
                        await peerConnection.addIceCandidate(msg.candidate);
                    break;

                case "chat":
                    addChatMessage(msg.user, msg.message);
                    break;

            }

        };

        ws.onclose = () => console.log("WebSocket closed");

    }
    catch (e) {

        console.error(e);

    }

}

/* -----------------------------------
   WEBRTC
----------------------------------- */
function createPeer() {

    if (peerConnection) return;

    peerConnection = new RTCPeerConnection(rtcConfig);

    if (localStream) {

        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

    }

    peerConnection.ontrack = (event) => {

        document.getElementById("remoteVideo").srcObject = event.streams[0];

    };

    peerConnection.onicecandidate = (event) => {

        if (event.candidate && ws) {

            ws.send(JSON.stringify({
                type: "ice",
                candidate: event.candidate
            }));

        }

    };

}

async function createOffer() {

    createPeer();

    const offer = await peerConnection.createOffer();

    await peerConnection.setLocalDescription(offer);

    ws.send(JSON.stringify({
        type: "offer",
        offer
    }));

}

async function handleOffer(offer) {

    createPeer();

    await peerConnection.setRemoteDescription(offer);

    const answer = await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(answer);

    ws.send(JSON.stringify({
        type: "answer",
        answer
    }));

}

/* -----------------------------------
   CHAT
----------------------------------- */
document.getElementById("sendBtn").onclick = () => {

    const input = document.getElementById("chatInput");

    const message = input.value.trim();

    if (!message) return;

    if (ws) {

        ws.send(JSON.stringify({
            type: "chat",
            message
        }));

    }

    addChatMessage("Me", message);

    input.value = "";

};

function addChatMessage(user, msg) {

    const div = document.createElement("div");

    div.textContent = `${user}: ${msg}`;

    document.getElementById("messages").appendChild(div);

}

/* -----------------------------------
   CONTROLS
----------------------------------- */
function toggleAudio() {

    if (!localStream) return;

    const track = localStream.getAudioTracks()[0];

    if (track) track.enabled = !track.enabled;

}

function toggleVideo() {

    if (!localStream) return;

    const track = localStream.getVideoTracks()[0];

    if (track) track.enabled = !track.enabled;

}

async function startScreenShare() {

    if (!peerConnection) return;

    const stream = await navigator.mediaDevices.getDisplayMedia({
        video: true
    });

    const track = stream.getVideoTracks()[0];

    const sender = peerConnection
        .getSenders()
        .find(s => s.track && s.track.kind === "video");

    if (sender) {

        sender.replaceTrack(track);

    }

}

function exitMeeting() {

    clearInterval(meetingTimerInterval);

    if (localStream) {

        localStream.getTracks().forEach(t => t.stop());

    }

    if (ws) {

        ws.close();

    }

    window.location.href = "/home";

}

/* -----------------------------------
   CHAT PANEL
----------------------------------- */
const chatPanel = document.getElementById("chatPanel");
const meetingContainer = document.getElementById("meetingContainer");

document.getElementById("chatToggleBtn").onclick = () => {

    chatPanel.classList.add("open");
    meetingContainer.classList.add("chat-open");

};

document.getElementById("closeChatBtn").onclick = () => {

    chatPanel.classList.remove("open");
    meetingContainer.classList.remove("chat-open");

};

/* -----------------------------------
   INIT
----------------------------------- */
window.addEventListener("load", async () => {

    startMeetingTimer();

    await initMedia();

    connectWebSocket();

});
</script>

</body>
</html>
