<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SnQ</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='create_account_styles.css') }}">
</head>
<body>

    <div class="wave-bg">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="login-container">

        <!-- Circular Logo -->
        <div class="logo-circle">
            <svg class="sync-icon" viewBox="0 0 24 24" fill="none">
                <path d="M4 12a8 8 0 0 1 13.66-5.66"
                      stroke="white"
                      stroke-width="2"
                      stroke-linecap="round"/>

                <polyline points="14 4 18 4 18 8"
                          stroke="white"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>

                <path d="M20 12a8 8 0 0 1-13.66 5.66"
                      stroke="white"
                      stroke-width="2"
                      stroke-linecap="round"/>

                <polyline points="10 20 6 20 6 16"
                          stroke="white"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
            </svg>
        </div>

        <h2>Create Your Account</h2>
        <p class="subtitle">Join SnQ and start collaborating securely.</p>

        <form method="post" action="{{ url_for('create_account') }}" class="login-form">

    <div class="form-group">
        <label for="first_name">First Name</label>
        <input
            type="text"
            id="first_name"
            name="first_name"
            placeholder="John"
            required>
    </div>

    <div class="form-group">
        <label for="last_name">Last Name</label>
        <input
            type="text"
            id="last_name"
            name="last_name"
            placeholder="Doe"
            required>
    </div>

    <div class="form-group">
        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="John.Doe@email.com"
            required>
    </div>

    <div class="form-group">
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="johndoe"
            required>
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 8 characters"
            required>
    </div>

    <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Re-enter your password"
            required>
    </div>

    <button type="submit">
        Create Account
    </button>

</form>

        <div class="extra-options">

            <a href="/login">
                ← Back to Login
            </a>

        </div>

    </div>

</body>
</html>
